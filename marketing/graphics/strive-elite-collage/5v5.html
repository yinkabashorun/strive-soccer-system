<!doctype html>
<html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,700;0,900;1,600&family=Inter:wght@500;600;700&display=block" rel="stylesheet">
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  body{width:1080px;height:1350px;overflow:hidden;background:#07070a}
  .stage{position:relative;width:1080px;height:1350px;overflow:hidden;
    background:radial-gradient(ellipse 70% 55% at 50% 30%,#2a2216 0%,#121008 45%,#07070a 80%)}
  .rays{position:absolute;left:-200px;top:-220px;width:1480px;height:1300px;opacity:.22;
    background:repeating-conic-gradient(from 0deg at 50% 38%,rgba(232,206,140,.55) 0deg 1.2deg,transparent 1.2deg 9deg);
    -webkit-mask-image:radial-gradient(circle at 50% 38%,#000 0%,transparent 62%);mask-image:radial-gradient(circle at 50% 38%,#000 0%,transparent 62%)}
  .halo{position:absolute;left:190px;top:40px;width:700px;height:700px;border-radius:50%;
    background:radial-gradient(circle,rgba(230,200,120,.45) 0%,rgba(200,168,88,.15) 40%,transparent 70%);filter:blur(10px)}
  .trophy{position:absolute;left:250px;top:70px;width:580px;filter:drop-shadow(0 0 40px rgba(230,195,110,.45)) drop-shadow(0 30px 40px rgba(0,0,0,.6))}
  .p{position:absolute;filter:drop-shadow(0 20px 26px rgba(0,0,0,.65)) contrast(1.06) saturate(.92)}
  .fade{-webkit-mask-image:linear-gradient(to bottom,#000 60%,transparent 95%);mask-image:linear-gradient(to bottom,#000 60%,transparent 95%)}
  .rim{filter:drop-shadow(0 0 2px rgba(240,215,150,.7)) drop-shadow(0 20px 26px rgba(0,0,0,.65)) contrast(1.06) saturate(.92)}
  #p2{left:80px;top:300px;height:640px}
  #p4{left:600px;top:420px;height:600px;-webkit-mask-image:linear-gradient(to bottom,transparent 0%,#000 9%,#000 60%,transparent 95%);mask-image:linear-gradient(to bottom,transparent 0%,#000 9%,#000 60%,transparent 95%)}
  #p1{left:-10px;top:560px;height:520px}
  #p3{left:420px;top:470px;height:700px}
  .floor{position:absolute;left:0;right:0;top:960px;bottom:0;
    background:linear-gradient(to bottom,rgba(7,7,10,0) 0%,rgba(7,7,10,.92) 26%,#07070a 40%)}
  .eyebrow{position:absolute;left:0;right:0;top:1052px;text-align:center;font-family:'Inter',sans-serif;
    font-weight:600;font-size:22px;letter-spacing:12px;color:#c8a858;text-transform:uppercase}
  .title{position:absolute;left:0;right:0;top:1086px;text-align:center;font-family:'Playfair Display',serif;
    font-weight:900;font-size:150px;line-height:1;letter-spacing:2px;
    background:linear-gradient(180deg,#fff6dc 0%,#ecd39a 38%,#c8a858 62%,#8f7230 100%);
    -webkit-background-clip:text;background-clip:text;color:transparent;
    filter:drop-shadow(0 4px 18px rgba(200,168,88,.35))}
  .rule{position:absolute;left:390px;width:300px;top:1252px;height:1px;background:linear-gradient(90deg,transparent,#c8a858,transparent)}
  .prize{position:absolute;left:0;right:0;top:1268px;text-align:center;font-family:'Playfair Display',serif;
    font-style:italic;font-weight:600;font-size:40px;color:#f3ead6;letter-spacing:1px}
  .prize b{font-style:normal;font-weight:900;color:#e6cf8e}
  .handle{position:absolute;left:44px;top:40px;font-family:'Inter',sans-serif;font-weight:600;font-size:20px;
    letter-spacing:3px;color:#f3ead6;text-transform:uppercase}
  .handle span{display:block;height:2px;width:100%;background:#c8a858;margin-top:6px}
  .logo{position:absolute;right:40px;top:26px;width:92px;filter:invert(1);mix-blend-mode:screen}
  .grain{position:absolute;inset:0;opacity:.12;mix-blend-mode:overlay;pointer-events:none;
    background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='200' height='200'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='2' stitchTiles='stitch'/></filter><rect width='200' height='200' filter='url(%23n)'/></svg>")}
</style></head>
<body><div class="stage">
  <div class="rays"></div>
  <div class="halo"></div>
  <svg class="trophy" viewBox="0 0 400 560" xmlns="http://www.w3.org/2000/svg">
    <defs>
      <linearGradient id="g" x1="0" x2="1" y1="0" y2="0">
        <stop offset="0" stop-color="#6e5420"/><stop offset=".18" stop-color="#c8a858"/>
        <stop offset=".34" stop-color="#fff2c6"/><stop offset=".5" stop-color="#e2c27a"/>
        <stop offset=".72" stop-color="#a8863c"/><stop offset=".88" stop-color="#e9d39a"/>
        <stop offset="1" stop-color="#5a4318"/>
      </linearGradient>
      <linearGradient id="gv" x1="0" x2="0" y1="0" y2="1">
        <stop offset="0" stop-color="#fff6d8" stop-opacity=".9"/><stop offset=".25" stop-color="#fff6d8" stop-opacity="0"/>
      </linearGradient>
      <linearGradient id="base" x1="0" x2="1">
        <stop offset="0" stop-color="#151310"/><stop offset=".45" stop-color="#3a3326"/><stop offset=".55" stop-color="#4a4130"/><stop offset="1" stop-color="#0e0d0b"/>
      </linearGradient>
    </defs>
    <!-- handles -->
    <path d="M78 70 C10 70 4 170 70 205 L84 188 C40 165 42 100 84 98 Z" fill="url(#g)"/>
    <path d="M322 70 C390 70 396 170 330 205 L316 188 C360 165 358 100 316 98 Z" fill="url(#g)"/>
    <!-- cup -->
    <path d="M70 40 L330 40 C330 170 300 250 228 282 L228 300 L172 300 L172 282 C100 250 70 170 70 40 Z" fill="url(#g)"/>
    <ellipse cx="200" cy="40" rx="130" ry="16" fill="#8c6d2c"/>
    <ellipse cx="200" cy="38" rx="122" ry="11" fill="#3b2d10"/>
    <path d="M70 40 L330 40 C330 170 300 250 228 282 L172 282 C100 250 70 170 70 40 Z" fill="url(#gv)"/>
    <path d="M118 70 C120 160 140 220 176 262" stroke="#fff8e0" stroke-opacity=".55" stroke-width="6" fill="none" stroke-linecap="round"/>
    <!-- stem -->
    <path d="M172 300 L228 300 L218 360 C240 372 252 382 256 398 L144 398 C148 382 160 372 182 360 Z" fill="url(#g)"/>
    <rect x="132" y="396" width="136" height="16" rx="3" fill="url(#g)"/>
    <!-- base -->
    <path d="M110 412 L290 412 L306 520 L94 520 Z" fill="url(#base)"/>
    <rect x="86" y="516" width="228" height="22" rx="3" fill="url(#base)"/>
    <rect x="150" y="448" width="100" height="34" rx="2" fill="url(#g)" opacity=".9"/>
    <path d="M110 412 L290 412" stroke="#c8a858" stroke-width="3"/>
  </svg>
  <img class="p fade" id="p2" src="cutouts/p2.png">
  <img class="p" id="p4" src="cutouts/p4.png">
  <img class="p fade" id="p1" src="cutouts/p1.png">
  <img class="p fade rim" id="p3" src="cutouts/p3.png">
  <div class="floor"></div>
  <div class="eyebrow">Strive Elite</div>
  <div class="title">5V5</div>
  <div class="rule"></div>
  <div class="prize"><b>$5,000</b> cash prize</div>
  <div class="handle">@strivesoccerfc<span></span></div>
  <img class="logo" src="strive-logo-512.png">
  <div class="grain"></div>
</div></body></html>
