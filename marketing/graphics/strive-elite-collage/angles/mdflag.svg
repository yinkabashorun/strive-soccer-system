<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 200" width="1500" height="1000">
<defs>
 <g id="calv">
  <rect width="150" height="100" fill="#000"/>
  <g fill="#e8b020"><rect x="0" width="25" height="100"/><rect x="50" width="25" height="100"/><rect x="100" width="25" height="100"/></g>
  <clipPath id="bend"><polygon points="0,-20 40,-20 190,90 190,130 150,130 0,20"/></clipPath>
  <g clip-path="url(#bend)"><rect width="150" height="100" fill="#e8b020"/>
   <g fill="#000"><rect x="0" width="25" height="100"/><rect x="50" width="25" height="100"/><rect x="100" width="25" height="100"/></g></g>
 </g>
 <g id="cross"><rect x="69" y="18" width="12" height="64"/><rect x="43" y="44" width="64" height="12"/>
  <circle cx="75" cy="15" r="7"/><circle cx="69" cy="21" r="5"/><circle cx="81" cy="21" r="5"/>
  <circle cx="75" cy="85" r="7"/><circle cx="69" cy="79" r="5"/><circle cx="81" cy="79" r="5"/>
  <circle cx="40" cy="50" r="7"/><circle cx="46" cy="44" r="5"/><circle cx="46" cy="56" r="5"/>
  <circle cx="110" cy="50" r="7"/><circle cx="104" cy="44" r="5"/><circle cx="104" cy="56" r="5"/></g>
 <clipPath id="tlbr"><rect width="75" height="50"/><rect x="75" y="50" width="75" height="50"/></clipPath>
 <clipPath id="trbl"><rect x="75" width="75" height="50"/><rect y="50" width="75" height="50"/></clipPath>
 <g id="cros">
  <rect width="150" height="100" fill="#fff"/>
  <g clip-path="url(#trbl)"><rect width="150" height="100" fill="#c8102e"/></g>
  <g clip-path="url(#tlbr)" fill="#c8102e"><use href="#cross"/></g>
  <g clip-path="url(#trbl)" fill="#fff"><use href="#cross"/></g>
 </g>
</defs>
<use href="#calv"/><use href="#cros" x="150"/><use href="#cros" y="100"/><use href="#calv" x="150" y="100"/>
</svg>
