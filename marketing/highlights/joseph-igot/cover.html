<!doctype html>
<html><head><meta charset="utf-8"><title>Joseph Igot cover</title>
<link rel="stylesheet" href="fonts.css">
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1080px;height:1920px;background:#0d0d0d;overflow:hidden}
.frame{position:relative;width:1080px;height:1920px;background:#0d0d0d;overflow:hidden}
.frame>img{position:absolute;left:-90px;top:-250px;width:1260px;height:auto;display:block}
.shade{position:absolute;left:0;right:0;bottom:0;height:720px;
  background:linear-gradient(to top,rgba(13,13,13,.92) 0%,rgba(13,13,13,.6) 40%,rgba(13,13,13,0) 100%)}
.top{position:absolute;left:0;right:0;top:0;height:320px;
  background:linear-gradient(to bottom,rgba(13,13,13,.55) 0%,rgba(13,13,13,0) 100%)}
.handle{position:absolute;left:56px;top:76px;font-family:'Barlow';font-weight:600;font-size:30px;
  letter-spacing:.18em;color:#fff;text-transform:uppercase;padding-bottom:10px;border-bottom:2px solid #c8a858}
.ring{position:absolute;right:56px;top:56px;width:112px;height:112px;border-radius:50%;
  border:2px dotted rgba(255,255,255,.75);display:flex;align-items:center;justify-content:center}
.ring img{width:84px;height:84px;object-fit:contain}
.eyebrow{position:absolute;left:56px;bottom:262px;font-family:'Barlow';font-weight:600;font-size:28px;
  letter-spacing:.3em;color:#c8a858;text-transform:uppercase}
.headline{position:absolute;left:52px;bottom:110px;font-family:'Barlow Condensed';font-weight:900;
  font-size:150px;line-height:.86;color:#fff;text-transform:uppercase;letter-spacing:.01em}
</style></head><body>
<div class="frame">
  <img src="photo.jpg" alt="">
  <div class="top"></div>
  <div class="shade"></div>
  <div class="handle">@strivesoccerfc</div>
  <div class="ring"><img src="logo-white.png" alt=""></div>
  <div class="eyebrow">Strive Soccer &nbsp;·&nbsp; Player Highlight</div>
  <div class="headline">Joseph Igot</div>
</div>
</body></html>
