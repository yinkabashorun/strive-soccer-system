<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="fonts.css">
<style>
*{box-sizing:border-box}html,body{margin:0;background:#0d0d0d}
.card{width:908px;height:1100px;padding:28px;background:#0d0d0d;font-family:'Barlow',sans-serif;color:#fff}
.shell{height:100%;border:4px solid #c8a858;border-radius:36px;background:#0a0a0a;padding:34px 40px}
.top{display:flex;align-items:center;justify-content:space-between}
.brand{display:flex;align-items:center;gap:14px;font-family:'Barlow Condensed',sans-serif;font-weight:900;font-size:40px;letter-spacing:.02em;text-transform:uppercase}
.brand img{width:52px;height:52px}.brand b{color:#e8c43a}
.icons{display:flex;align-items:center;gap:22px}
.bell{position:relative;width:34px;height:34px;border:3px solid #fff;border-radius:50% 50% 8px 8px;opacity:.9}
.bell i{position:absolute;top:-14px;right:-14px;width:26px;height:26px;border-radius:50%;background:#e23b3b;font-style:normal;font-size:16px;font-weight:700;display:grid;place-items:center}
.avatar{width:58px;height:58px;border-radius:50%;background:#e8c43a;color:#000;font-weight:800;font-size:22px;display:grid;place-items:center}
.box{margin-top:40px;border:1px solid rgba(255,255,255,.1);border-radius:26px;background:#121212;padding:34px 36px}
.score{display:flex;align-items:center;gap:34px}
.ring{width:170px;height:170px;border-radius:50%;background:conic-gradient(#e8c43a 0 72%,rgba(255,255,255,.1) 72% 100%);display:grid;place-items:center;flex:none}
.ring div{width:134px;height:134px;border-radius:50%;background:#121212;display:grid;place-items:center;text-align:center;line-height:1}
.ring b{font-family:'Barlow Condensed',sans-serif;font-weight:900;font-size:56px}
.ring small{display:block;font-size:13px;letter-spacing:.2em;text-transform:uppercase;color:rgba(255,255,255,.55);margin-top:6px}
.lbl{font-size:16px;letter-spacing:.22em;text-transform:uppercase;color:rgba(255,255,255,.5)}
.sub{margin-top:10px;font-size:24px;color:rgba(255,255,255,.85)}
.gain .lbl{color:#e8c43a}
.gain h3{margin:12px 0 8px;font-weight:800;font-size:36px}.gain h3 b{color:#e8c43a}
.gain p{margin:0;font-size:22px;color:rgba(255,255,255,.65)}
.bars{margin-top:30px}
.bar{padding:18px 0;border-top:1px solid rgba(255,255,255,.08)}
.bar .row{display:flex;justify-content:space-between;font-size:24px;font-weight:600}
.bar .row span b{font-size:26px}.bar .row span i{font-style:normal;color:#e8c43a;font-size:18px;margin-left:8px}
.bar .track{margin-top:12px;height:10px;border-radius:999px;background:rgba(255,255,255,.1)}
.bar .fill{height:100%;border-radius:999px;background:#e8c43a}
</style></head><body><div class="card"><div class="shell">
<div class="top"><div class="brand"><img src="logo-white.png">Strive <b>Elite</b></div><div class="icons"><div class="bell"><i>1</i></div><div class="avatar">AR</div></div></div>
<div class="box"><div class="score"><div class="ring"><div><span><b>72%</b><small>Overall</small></span></div></div><div><div class="lbl">Development score</div><div class="sub">Across 7 pillars</div></div></div></div>
<div class="box gain"><div class="lbl">Biggest gain</div><h3>Ball Mastery <b>+11</b></h3><p>Up from 71 to 82 this block.</p></div>
<div class="bars"><div class="bar"><div class="row"><span>Ball Mastery</span><span><b>82</b><i>+11</i></span></div><div class="track"><div class="fill" style="width:82%"></div></div></div><div class="bar"><div class="row"><span>1v1 Skills</span><span><b>71</b><i>+6</i></span></div><div class="track"><div class="fill" style="width:71%"></div></div></div><div class="bar"><div class="row"><span>Weak Foot</span><span><b>54</b><i>+4</i></span></div><div class="track"><div class="fill" style="width:54%"></div></div></div><div class="bar"><div class="row"><span>Passing</span><span><b>78</b><i>+5</i></span></div><div class="track"><div class="fill" style="width:78%"></div></div></div></div></div></div></body></html>
