<!doctype html><meta charset="utf-8">
<title>Cover (1080x1350)</title>
<link rel="stylesheet" href="../../covers/strive-elite-meeting/fonts.css">
<style>
/* Slide 1. Coach Yinka's hook (Nov 4 2026): "if a parent paid us
   $100,000 to get their kid on a pro academy, what would we do? Then we
   put it all into one program. Strive Elite. Swipe to see the inside."
   "their player" by the Oct 7 wording rule. Photo slot: a big group
   session or camp photo once he sends one (photos/hero.jpg); until then
   brand black, no posed shoot photo (his Nov 4 rule). */
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:1080px;height:1350px;background:#0d0d0d;overflow:hidden}
body{font-family:'Barlow',sans-serif;color:#fff;position:relative}
.ph{position:absolute;inset:0;background:#0d0d0d url(photos/hero.jpg) center/cover}
.sh{position:absolute;inset:0;background:linear-gradient(180deg,rgba(13,13,13,.6) 0%,rgba(13,13,13,.35) 30%,rgba(13,13,13,.85) 60%,rgba(13,13,13,.98) 100%)}
.top{position:absolute;left:72px;top:64px;right:72px;display:flex;justify-content:space-between;align-items:center}
.eyebrow{font-family:'Barlow Condensed';font-weight:800;font-size:24px;letter-spacing:.3em;text-transform:uppercase;color:#c8a858}
.wm{font-family:'Barlow Condensed';font-weight:900;font-size:26px;letter-spacing:.12em;text-transform:uppercase}
.wm span{color:#c8a858}
.txt{position:absolute;left:72px;right:72px;bottom:150px}
.kick{font-family:'Barlow Condensed';font-weight:800;font-size:28px;letter-spacing:.22em;text-transform:uppercase;color:#c8a858;margin-bottom:22px}
h1{font-family:'Barlow Condensed';font-weight:900;font-size:86px;line-height:.92;text-transform:uppercase;letter-spacing:.005em;text-shadow:0 6px 40px rgba(0,0,0,.6)}
h1 span{color:#c8a858}
.ans{margin-top:34px;font-size:34px;line-height:1.3;font-weight:500;color:#fff;max-width:900px}
.ans b{font-family:'Barlow Condensed';font-weight:900;font-size:60px;line-height:1;text-transform:uppercase;letter-spacing:.02em;display:block;margin-top:14px}
.ans b span{color:#c8a858}
.swipe{position:absolute;right:72px;bottom:64px;font-family:'Barlow Condensed';font-weight:800;font-size:24px;letter-spacing:.28em;text-transform:uppercase;color:#fff;display:flex;align-items:center;gap:14px}
.swipe i{display:block;width:44px;height:2px;background:#c8a858;position:relative}
.swipe i:after{content:"";position:absolute;right:0;top:-6px;width:12px;height:12px;border-top:2px solid #c8a858;border-right:2px solid #c8a858;transform:rotate(45deg)}
.handle{position:absolute;left:72px;bottom:64px;font-weight:700;font-size:22px;letter-spacing:.18em;text-transform:uppercase}
.handle:after{content:"";display:block;height:2px;width:100%;background:#c8a858;margin-top:6px}
</style>
<div class="ph"></div><div class="sh"></div>
<div class="top"><div class="eyebrow">For ECNL and MLS NEXT players</div><div class="wm">Strive <span>Elite</span></div></div>
<div class="txt">
  <div class="kick">We asked ourselves one question</div>
  <h1>If a parent paid us <span>$100,000</span> to get their player into a pro academy, what would we&nbsp;do?</h1>
  <p class="ans">Then we put all of it into one program.<b>Strive <span>Elite.</span></b></p>
</div>
<div class="handle">@strivesoccerfc</div>
<div class="swipe">Swipe to see inside <i></i></div>
