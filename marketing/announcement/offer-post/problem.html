<!doctype html><meta charset="utf-8">
<title>The problem (1080x1350)</title>
<link rel="stylesheet" href="../../covers/strive-elite-meeting/fonts.css">
<style>
/* Slide 2. The /demo headline (Coach Yinka, Oct 6) over the crouched
   coach photo, then Gary's VSL line: the hours between practices are
   the part nobody coaches. */
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:1080px;height:1350px;background:#0d0d0d;overflow:hidden}
body{font-family:'Barlow',sans-serif;color:#fff;position:relative}
.ph{position:absolute;left:0;top:0;width:1080px;height:760px;background:url(photos/watching.jpg) center 30%/cover}
.sh{position:absolute;left:0;top:0;width:1080px;height:760px;background:linear-gradient(180deg,rgba(13,13,13,0) 45%,rgba(13,13,13,1) 100%)}
.txt{position:absolute;left:84px;right:84px;top:600px}
.eyebrow{font-family:'Barlow Condensed';font-weight:800;font-size:24px;letter-spacing:.3em;text-transform:uppercase;color:#c8a858}
h1{font-family:'Barlow Condensed';font-weight:900;font-size:92px;line-height:.93;text-transform:uppercase;margin-top:18px;letter-spacing:.005em}
h1 span{color:#c8a858}
.rule{width:120px;height:3px;background:#c8a858;margin:34px 0 30px}
.p{font-size:31px;line-height:1.32;font-weight:500;max-width:900px}
.p+.p{margin-top:18px}
.p b{font-weight:700;color:#c8a858}
.bar{position:absolute;left:84px;right:84px;bottom:64px;display:flex;align-items:center;justify-content:space-between}
.handle{font-weight:700;font-size:22px;letter-spacing:.18em;text-transform:uppercase}
.handle:after{content:"";display:block;height:2px;width:100%;background:#c8a858;margin-top:6px}
.n{font-family:'Barlow Condensed';font-weight:800;font-size:24px;letter-spacing:.28em;text-transform:uppercase;color:rgba(255,255,255,.5)}
</style>
<div class="ph"></div><div class="sh"></div>
<div class="txt">
  <div class="eyebrow">The honest part</div>
  <h1>Team training 3-4x a week is <span>not close to enough.</span></h1>
  <div class="rule"></div>
  <p class="p">The next level is decided in the hours between practices. The touches, the weak foot, the first step. <b>That's the part nobody coaches.</b></p>
  <p class="p">So we built the thing that does.</p>
</div>
<div class="bar"><div class="handle">@strivesoccerfc</div></div>
