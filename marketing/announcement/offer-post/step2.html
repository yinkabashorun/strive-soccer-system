<!doctype html><meta charset="utf-8">
<title>Step 02 (1080x1350)</title>
<link rel="stylesheet" href="../../covers/strive-elite-meeting/fonts.css">
<style>
/* The walk, Nike-standard pass (Coach Yinka, Nov 4 2026: "Would Nike post
   a layout like this?"): one real Strive frame, one line, one sentence,
   the names as chips. Frames are the bank's own clips (public/drills). */
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:1080px;height:1350px;background:#0d0d0d;overflow:hidden}
body{font-family:'Barlow',sans-serif;color:#fff;position:relative}
.ph{position:absolute;inset:0;background:url(photos/step2.jpg) center 25%/cover;filter:saturate(.85) contrast(1.06)}
.sh{position:absolute;inset:0;background:linear-gradient(180deg,rgba(13,13,13,.5) 0%,rgba(13,13,13,0) 20%,rgba(13,13,13,0) 42%,rgba(13,13,13,.78) 62%,rgba(13,13,13,.98) 78%,#0d0d0d 100%)}
.top{position:absolute;left:64px;top:60px;right:64px;display:flex;justify-content:space-between;align-items:center}
.step{font-family:'Barlow Condensed';font-weight:800;font-size:24px;letter-spacing:.3em;text-transform:uppercase;color:#c8a858}
.wm{font-family:'Barlow Condensed';font-weight:900;font-size:26px;letter-spacing:.12em;text-transform:uppercase}
.wm span{color:#c8a858}
.txt{position:absolute;left:64px;right:64px;bottom:150px}
h1{font-family:'Barlow Condensed';font-weight:900;font-size:112px;line-height:.9;text-transform:uppercase;letter-spacing:.005em;text-shadow:0 8px 50px rgba(0,0,0,.7)}
h1 span{color:#c8a858}
.p{margin-top:26px;font-size:32px;line-height:1.3;font-weight:500;max-width:900px;color:rgba(255,255,255,.92)}
.chips{margin-top:30px;display:flex;flex-wrap:wrap;gap:12px}
.chips span{font-family:'Barlow Condensed';font-weight:800;font-size:27px;letter-spacing:.1em;text-transform:uppercase;padding:12px 20px 11px;border:1.5px solid rgba(200,168,88,.85);color:#fff;border-radius:4px;background:rgba(13,13,13,.35)}
.swipe{position:absolute;right:64px;bottom:60px;font-family:'Barlow Condensed';font-weight:800;font-size:22px;letter-spacing:.28em;text-transform:uppercase;display:flex;align-items:center;gap:12px}
.swipe i{display:block;width:40px;height:2px;background:#c8a858;position:relative}
.swipe i:after{content:"";position:absolute;right:0;top:-6px;width:12px;height:12px;border-top:2px solid #c8a858;border-right:2px solid #c8a858;transform:rotate(45deg)}
.handle{position:absolute;left:64px;bottom:60px;font-weight:700;font-size:22px;letter-spacing:.18em;text-transform:uppercase}
.handle:after{content:"";display:block;height:2px;width:100%;background:#c8a858;margin-top:6px}
</style>
<div class="ph"></div><div class="sh"></div>
<div class="top"><div class="step">What we'd do, 02 of 05</div><div class="wm">Strive <span>Elite</span></div></div>
