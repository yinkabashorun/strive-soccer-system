<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Strive Elite</title>
    <style>
      html, body { margin: 0; height: 100%; background: #000; color: #f5f4ef;
        font-family: -apple-system, system-ui, sans-serif; -webkit-font-smoothing: antialiased; }
      main { min-height: 100%; display: flex; flex-direction: column; align-items: center;
        justify-content: center; text-align: center; padding: 32px; box-sizing: border-box; }
      .mark { font-weight: 900; letter-spacing: 0.06em; font-size: 22px; text-transform: uppercase; }
      .mark span { color: #d4af37; }
      h1 { margin: 36px 0 10px; font-size: 30px; font-weight: 900; text-transform: uppercase; line-height: 1.05; }
      p { margin: 0; max-width: 300px; font-size: 16px; line-height: 1.5; color: rgba(245, 244, 239, 0.72); }
      button { margin-top: 32px; height: 56px; width: 100%; max-width: 300px; border: 0; border-radius: 16px;
        background: #fff; color: #000; font-size: 18px; font-weight: 900; text-transform: uppercase; letter-spacing: 0.04em; }
      button:active { transform: scale(0.98); }
    </style>
  </head>
  <body>
    <main>
      <div class="mark">Strive <span>Elite</span></div>
      <h1>You're offline</h1>
      <p>Your training needs a connection to load. Check your signal or Wi-Fi, then try again.</p>
      <button id="retry" type="button">Try again</button>
    </main>
    <script>
      var HOME = "https://thestriveapp.com/";
      function retry() { window.location.replace(HOME); }
      document.getElementById("retry").addEventListener("click", retry);
      // Back online on its own: go straight back in.
      window.addEventListener("online", retry);
    </script>
  </body>
</html>
