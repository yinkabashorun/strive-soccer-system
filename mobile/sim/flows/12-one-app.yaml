# ONE APP (lib/elite/one-app.ts): a Strive Pro member who came through the
# free app. Strive Pro adds the Train tab and takes nothing away: the same
# Friends, Week, Clubs and You are one tap from it, with the same friends
# and clubs in them. Then a whole session from Train, and the finish
# screen's one quiet row, "Post it to your friends".
appId: com.strivesoccer.elite
---
- launchApp:
    clearState: true
    arguments:
      fixtureState: social
- extendedWaitUntil:
    visible: "Start session"
    timeout: 30000
- takeScreenshot: t60-train
- tapOn: "Friends"
- extendedWaitUntil:
    visible: "Post my training"
    timeout: 15000
- takeScreenshot: t61-train-friends
- tapOn: "Clubs"
- waitForAnimationToEnd:
    timeout: 4000
- takeScreenshot: t62-train-clubs
- tapOn: "Week"
- waitForAnimationToEnd:
    timeout: 4000
- takeScreenshot: t63-train-week
- tapOn: "You"
- waitForAnimationToEnd:
    timeout: 4000
- takeScreenshot: t64-train-you
- tapOn: "Train"
- extendedWaitUntil:
    visible: "Start session"
    timeout: 15000
- scrollUntilVisible:
    element: "All courses"
    direction: DOWN
    timeout: 20000
- takeScreenshot: t65-train-courses
- scrollUntilVisible:
    element: "Start session"
    direction: UP
    timeout: 20000
- tapOn: "Start session"
- extendedWaitUntil:
    visible: "Done"
    timeout: 20000
- tapOn: "Done"
- waitForAnimationToEnd:
    timeout: 3000
- tapOn: "Done"
- waitForAnimationToEnd:
    timeout: 3000
- tapOn: "Done"
- waitForAnimationToEnd:
    timeout: 3000
- tapOn: "Done"
- waitForAnimationToEnd:
    timeout: 6000
- scrollUntilVisible:
    element: "Post it to your friends"
    direction: DOWN
    timeout: 15000
- takeScreenshot: t66-train-finish
- tapOn: "Post it to your friends"
- extendedWaitUntil:
    visible: "Take a photo"
    timeout: 15000
- takeScreenshot: t67-train-post-session
