<!doctype html><meta charset="utf-8">

<style>
/* The walk, framed the Nike way (Coach Yinka, Nov 4 2026): headline in the
   negative space at the top, the coach uncovered in the clear band under

   photos/stepN.jpg so the face lands at about y 500. */
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:1080px;height:1350px;background:#0d0d0d;overflow:hidden}
body{font-family:'Barlow',sans-serif;color:#fff;position:relative}
.ph{position:absolute;inset:0;background:#0d0d0d url(photos/step5.jpg) center top/1080px 1350px;filter:saturate(.85) contrast(1.06)}
.div{position:absolute;left:539px;top:0;width:2px;height:1350px;background:linear-gradient(180deg,rgba(200,168,88,0) 8%,rgba(200,168,88,.9) 30%,rgba(200,168,88,.9) 55%,rgba(200,168,88,0) 80%)}
.sh{position:absolute;inset:0;background:linear-gradient(180deg,rgba(13,13,13,.92) 0%,rgba(13,13,13,.55) 22%,rgba(13,13,13,0) 36%,rgba(13,13,13,0) 66%,rgba(13,13,13,.8) 80%,#0d0d0d 92%,#0d0d0d 100%)}
.top{position:absolute;left:64px;top:56px;right:64px;display:flex;justify-content:space-between;align-items:center}
.step{font-family:'Barlow Condensed';font-weight:800;font-size:23px;letter-spacing:.3em;text-transform:uppercase;color:#c8a858}
.wm{font-family:'Barlow Condensed';font-weight:900;font-size:25px;letter-spacing:.12em;text-transform:uppercase}
.wm span{color:#c8a858}
h1{position:absolute;left:64px;top:104px;right:64px;font-family:'Barlow Condensed';font-weight:900;font-size:104px;line-height:.9;text-transform:uppercase;letter-spacing:.005em;text-shadow:0 8px 50px rgba(0,0,0,.6)}
h1 span{color:#c8a858}
.low{position:absolute;left:64px;right:64px;bottom:140px}
.p{font-size:30px;line-height:1.3;font-weight:500;max-width:860px;color:rgba(255,255,255,.92)}
.chips{margin-top:22px;display:flex;flex-wrap:wrap;gap:10px}
.chips span{font-family:'Barlow Condensed';font-weight:800;font-size:24px;letter-spacing:.1em;text-transform:uppercase;padding:10px 16px 9px;border:1.5px solid rgba(200,168,88,.85);color:#fff;border-radius:4px;background:rgba(13,13,13,.4)}
.swipe{position:absolute;right:64px;bottom:60px;font-family:'Barlow Condensed';font-weight:800;font-size:22px;letter-spacing:.28em;text-transform:uppercase;display:flex;align-items:center;gap:12px}
.swipe i{display:block;width:40px;height:2px;background:#c8a858;position:relative}
.swipe i:after{content:"";position:absolute;right:0;top:-6px;width:12px;height:12px;border-top:2px solid #c8a858;border-right:2px solid #c8a858;transform:rotate(45deg)}
.handle{position:absolute;left:64px;bottom:60px;font-weight:700;font-size:22px;letter-spacing:.18em;text-transform:uppercase}
.handle:after{content:"";display:block;height:2px;width:100%;background:#c8a858;margin-top:6px}
