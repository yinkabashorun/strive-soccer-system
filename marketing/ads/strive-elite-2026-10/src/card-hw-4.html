<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="fonts.css">
<style>
*{box-sizing:border-box}html,body{margin:0;background:#0d0d0d}
.card{width:908px;height:900px;padding:28px;background:#0d0d0d;font-family:'Barlow',sans-serif;color:#fff}
.shell{height:100%;border:4px solid #c8a858;border-radius:36px;background:#0a0a0a;padding:34px 40px;display:flex;flex-direction:column}
.top{display:flex;align-items:center;justify-content:space-between}
.brand{display:flex;align-items:center;gap:14px;font-family:'Barlow Condensed',sans-serif;font-weight:900;font-size:40px;letter-spacing:.02em;text-transform:uppercase}
.brand img{width:52px;height:52px}
.brand b{color:#e8c43a}
.icons{display:flex;align-items:center;gap:22px}
.bell{position:relative;width:34px;height:34px;border:3px solid #fff;border-radius:50% 50% 8px 8px;opacity:.9}
.bell i{position:absolute;top:-14px;right:-14px;width:26px;height:26px;border-radius:50%;background:#e23b3b;font-style:normal;font-size:16px;font-weight:700;display:grid;place-items:center}
.avatar{width:58px;height:58px;border-radius:50%;background:#e8c43a;color:#000;font-weight:800;font-size:22px;display:grid;place-items:center}
.session{margin-top:44px;display:flex;align-items:center;justify-content:space-between}
.session .l{display:flex;align-items:center;gap:14px;font-weight:800;font-size:26px;letter-spacing:.04em}
.session .n{width:34px;height:34px;border-radius:8px;background:#e8c43a;color:#000;display:grid;place-items:center;font-size:20px}
.session .r{font-size:18px;color:rgba(255,255,255,.5)}
.drill{margin-top:28px;border:1px solid rgba(255,255,255,.1);border-radius:26px;background:#121212;padding:30px 32px;display:flex;gap:22px}
.check{width:44px;height:44px;border-radius:50%;background:#e8c43a;flex:none;display:grid;place-items:center}
.check svg{width:24px;height:24px}
.body{flex:1}
.meta{display:flex;align-items:center;gap:14px}
.pill{border:1.5px solid #e8c43a;color:#e8c43a;border-radius:999px;padding:6px 16px;font-size:14px;font-weight:800;letter-spacing:.18em;text-transform:uppercase}
.chip{margin-left:auto;border:1.5px solid rgba(255,255,255,.25);border-radius:999px;padding:6px 16px;font-size:15px;letter-spacing:.14em;color:rgba(255,255,255,.75)}
.title{margin-top:22px;font-weight:800;font-size:31px;line-height:1.15}
.how{margin-top:16px;font-size:23px;line-height:1.45;color:rgba(255,255,255,.72)}
.video{margin-top:24px;width:420px;border:3px solid #fff;border-radius:18px;overflow:hidden;position:relative;background:#000}
.video img{width:100%;display:block}
.play{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:76px;height:76px;border-radius:50%;background:rgba(0,0,0,.55);display:grid;place-items:center}
.play::after{content:"";margin-left:8px;border-left:30px solid #fff;border-top:18px solid transparent;border-bottom:18px solid transparent}
.label{position:absolute;left:0;right:0;bottom:0;padding:12px 16px;background:linear-gradient(0deg,rgba(0,0,0,.85),rgba(0,0,0,0));font-weight:800;font-size:15px;letter-spacing:.2em;text-transform:uppercase}
</style></head><body><div class="card"><div class="shell">
<div class="top"><div class="brand"><img src="logo-white.png">Strive <b>Elite</b></div>
<div class="icons"><div class="bell"><i>1</i></div><div class="avatar">AR</div></div></div>
<div class="session"><div class="l"><span class="n">1</span>Session 1</div><div class="r">4/4</div></div>
<div class="drill"><div class="check"><svg viewBox="0 0 24 24" fill="none" stroke="#000" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12l5 5L20 7"/></svg></div>
<div class="body">
<div class="meta"><span class="pill">Ball Mastery</span><span class="chip">5 x 45 sec</span><span class="chip" style="margin-left:0">8 min</span></div>
<div class="title">La Croqueta cone weave</div>
<div class="how">Line of 5 cones a yard apart. La croqueta at every cone: quick shift foot to foot, glide past. Both directions. Quick shift, stay low, accelerate out.</div>
<div class="video"><img src="t4.jpg"><div class="play"></div><div class="label">Watch demo</div></div>
</div></div>
</div></div></body></html>
