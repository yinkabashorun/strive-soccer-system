name: CI

# Every push and PR: types, lint, unit tests of the rules that have bitten
# real players, a production build, and a check that no cron route was
# prerendered static. Nothing merges to main without this being green
# (turn on "Require status checks" for main in GitHub branch protection).
on:
  push:
    branches: ["**"]
    # Marketing assets and the business-facts file never touch the app.
    # Skipping them keeps a burst of graphic tweaks from flooding the
    # runner queue (Oct 5: 14 pushes in 10 min, one run cancelled as a
    # result, nothing wrong with the code).
    paths-ignore:
      - "marketing/**"
      - "CLAUDE.md"
  pull_request:
    paths-ignore:
      - "marketing/**"
      - "CLAUDE.md"

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: "1"
      - run: npm run check:crons
      - run: npm run check:library
