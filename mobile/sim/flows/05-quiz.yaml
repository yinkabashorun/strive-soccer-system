# The first screens of the quiz by taps, from the door.
appId: com.strivesoccer.elite
---
- launchApp:
    clearState: true
    arguments:
      fixtureState: onboarding
- extendedWaitUntil:
    visible: "Build my week"
    timeout: 30000
- takeScreenshot: t14-door
- waitForAnimationToEnd:
    timeout: 4000
- takeScreenshot: t14b-door-settled
- extendedWaitUntil:
    visible: "This text is never on the door"
    timeout: 6000
    optional: true
- takeScreenshot: t14c-door-ten-seconds
- tapOn: "Build my week"
- extendedWaitUntil:
    visible: "Boy"
    timeout: 15000
- takeScreenshot: t15-quiz-first-question
- tapOn: "Boy"
- waitForAnimationToEnd:
    timeout: 4000
- takeScreenshot: t16-quiz-second-question
