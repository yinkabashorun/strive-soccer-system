<!doctype html><meta charset="utf-8">
<link rel="stylesheet" href="fonts.css">
<style>
html,body{margin:0;width:1920px;height:1080px;background:#0d0d0d;overflow:hidden}
body{font-family:'Barlow',sans-serif;color:#fff;position:relative}
.glow{position:absolute;left:50%;top:50%;width:1400px;height:700px;transform:translate(-50%,-50%);background:radial-gradient(ellipse at center,rgba(200,168,88,.10),rgba(200,168,88,0) 62%)}
.grain{position:absolute;inset:0;background:
  linear-gradient(90deg,rgba(255,255,255,.025) 1px,transparent 1px) 0 0/120px 120px,
  linear-gradient(rgba(255,255,255,.025) 1px,transparent 1px) 0 0/120px 120px;
  mask-image:radial-gradient(ellipse at center,#000 30%,transparent 80%);-webkit-mask-image:radial-gradient(ellipse at center,#000 30%,transparent 80%)}
.wrap{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:0}
.mark{width:150px;height:150px;border-radius:50%;background:#fff;display:grid;place-items:center;margin-bottom:38px}
.mark img{width:112px;height:112px;filter:invert(1)}
.word{font-family:'Barlow Condensed';font-weight:900;font-size:208px;line-height:.9;letter-spacing:.015em;text-transform:uppercase;white-space:nowrap}
.word b{color:#c8a858;font-weight:900}
.rule{width:140px;height:3px;background:#c8a858;margin:38px 0 30px}
.tag{font-family:'Barlow Condensed';font-weight:800;font-size:48px;letter-spacing:.28em;text-transform:uppercase;color:#fff}
.sub{margin-top:22px;font-weight:600;font-size:26px;letter-spacing:.06em;color:rgba(255,255,255,.5)}
.handle{position:absolute;left:72px;bottom:56px;font-weight:700;font-size:24px;letter-spacing:.18em;text-transform:uppercase;color:#fff}
.handle:after{content:"";display:block;height:2px;width:100%;background:#c8a858;margin-top:8px}
.url{position:absolute;right:72px;bottom:56px;font-weight:600;font-size:24px;letter-spacing:.04em;color:rgba(255,255,255,.55)}
</style>
<div class="glow"></div><div class="grain"></div>
<div class="wrap">
  <div class="mark"><img src="mark-white.png" alt=""></div>
  <div class="word">STRIVE <b>ELITE</b></div>
  <div class="rule"></div>
  <div class="tag">Personalized training</div>
  <div class="sub">Built by Coach Yinka and Coach Gary</div>
</div>
<div class="handle">@strivesoccerfc</div>
<div class="url">thestriveapp.com</div>
