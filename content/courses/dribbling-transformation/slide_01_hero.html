<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Ball Mastery Transformation</title>
    <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@700;800&family=Barlow:wght@400;500&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { background-color: #0d0d0d; color: #ffffff; font-family: 'Barlow', sans-serif; overflow-x: hidden; }
        .slide-container {
            width: 100%;
            max-width: 1280px;
            margin: 0 auto;
            min-height: 100vh;
            position: relative;
            background-color: #0d0d0d;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding-bottom: 80px; /* Space for nav */
        }
        .video-bg {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            z-index: 1;
            opacity: 0.4;
        }
        .content {
            position: relative;
            z-index: 3;
            width: 100%;
            padding: 40px 20px;
            text-align: center;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .brand-mark {
            font-family: 'Barlow Condensed', sans-serif;
            font-weight: 700;
            font-size: 18px;
            letter-spacing: 0.3em;
            color: rgba(255, 255, 255, 0.7);
            margin-bottom: 20px;
            text-transform: uppercase;
        }
        h1 {
            font-family: 'Barlow Condensed', sans-serif;
            font-weight: 800;
            font-size: 48px; /* Mobile friendly */
            line-height: 1.1;
            text-transform: uppercase;
            margin-bottom: 16px;
            letter-spacing: -0.02em;
        }
        h2 {
            font-family: 'Barlow', sans-serif;
            font-weight: 500;
            font-size: 20px; /* Mobile friendly */
            color: rgba(255, 255, 255, 0.9);
            margin-bottom: 24px;
            letter-spacing: 0.05em;
        }
        p {
            font-family: 'Barlow', sans-serif;
            font-weight: 400;
            font-size: 16px; /* Mobile friendly */
            line-height: 1.6;
            max-width: 600px;
            color: rgba(255, 255, 255, 0.8);
            margin-bottom: 30px;
        }
        .line {
            width: 60px;
            height: 3px;
            background-color: #ffffff;
            margin-bottom: 20px;
        }

        /* Desktop overrides */
        @media (min-width: 768px) {
            h1 { font-size: 80px; }
            h2 { font-size: 32px; }
            p { font-size: 20px; }
            .brand-mark { font-size: 24px; margin-bottom: 40px; }
            .line { width: 80px; height: 4px; margin-bottom: 40px; }
        }

        /* Navigation Bar */
        .nav-buttons {
            display: flex;
            gap: 12px;
            margin-top: 32px;
            width: 100%;
            position: relative;
            z-index: 10;
        }
        .nav-btn {
            background: rgba(255, 255, 255, 0.1);
            color: #fff;
            padding: 12px 0;
            text-decoration: none;
            text-transform: uppercase;
            font-weight: 700;
            letter-spacing: 0.1em;
            border: 1px solid rgba(255, 255, 255, 0.2);
            text-align: center;
            flex: 1;
            font-size: 14px;
        }
        .nav-btn.home {
            flex: 0 0 50px; /* Small square for home */
            font-size: 20px;
        }
        .nav-btn:active { background: #fff; color: #0d0d0d; }
    </style>
</head>
<body>




    <div class="slide-container">
        <video class="video-bg" autoplay muted loop playsinline>
            <source src="https://files.manuscdn.com/user_upload_by_module/session_file/310519663373072550/MEUrZzsdOeBvIaSY.mov" type="video/mp4">
        </video>
        
        <div class="content">
            <div class="brand-mark">Strive Soccer</div>
            <div class="line"></div>
            <h1>Ball Mastery<br>Transformation</h1>
            <h2>A Premium Training System</h2>
            <p>The course that turns raw potential into elite control. 60 minutes of structured daily training designed to make the ball do exactly what you want — every time.</p>
        </div>

        <div class="nav-buttons">
            <a href="index.html" class="nav-btn home">⌂</a>
            <a href="slide_02_philosophy.html" class="nav-btn">NEXT ›</a>
        </div>
    </div>
</body>
</html>
