name: CI

# Every push and PR: types, lint, unit tests of the rules that have bitten
# real players, a production build, and a check that no cron route was
# prerendered static. Nothing merges to main without this being green
# (turn on "Require status checks" for main in GitHub branch protection).
on:
  push:
    branches: ["**"]
    # Marketing assets and the business-facts file never touch the app.
    # Skipping them keeps a burst of graphic tweaks from flooding the
    # runner queue (Oct 5: 14 pushes in 10 min, one run cancelled as a
    # result, nothing wrong with the code).
    paths-ignore:
      - "marketing/**"
      - "CLAUDE.md"
  pull_request:
    paths-ignore:
      - "marketing/**"
      - "CLAUDE.md"

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: "1"
      - run: npm run check:crons
      - run: npm run check:library
      # Vercel rewrites vercel.json onto one line before it builds, so a test
      # that matches that file's spacing passes here and fails only there
      # (every deploy failed that way on Nov 23 2026). Run the tests once
      # more against the file as Vercel sees it.
      - name: Tests as Vercel runs them (vercel.json on one line)
        run: |
          node -e "const fs=require('fs');fs.writeFileSync('vercel.json',JSON.stringify(JSON.parse(fs.readFileSync('vercel.json','utf8'))))"
          npm test

  # The native iPhone app (mobile/), checked the way the Mac that builds it
  # for TestFlight sees it: a fresh checkout with ONLY mobile/'s packages
  # installed, never the site's. Types, the app's tests, the iPhone bundle,
  # then the iPhone project generated with a build number set, the same
  # steps "Native iOS to TestFlight" runs before it compiles. A Mac run
  # waits in line and is started by hand, so anything that can fail here
  # should fail here first (the first native run died at the type check
  # because a shared file's packages were only in the site's node_modules).
  mobile:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    env:
      CI: "1"
      EXPO_NO_TELEMETRY: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - run: npm ci
      - run: npm run verify
      - name: Generate the iPhone project (as the TestFlight run does)
        env:
          BUILD_NUMBER: "1"
        run: |
          node -e 'const f="app.json";const c=JSON.parse(require("fs").readFileSync(f,"utf8"));c.expo.ios.buildNumber=process.env.BUILD_NUMBER;require("fs").writeFileSync(f,JSON.stringify(c,null,2));'
          npx expo prebuild --platform ios --clean
          test -f ios/StriveElite.xcodeproj/xcshareddata/xcschemes/StriveElite.xcscheme
