<!doctype html><meta charset="utf-8">
<title>Cover (1080x1350)</title>
<link rel="stylesheet" href="../../covers/strive-elite-meeting/fonts.css">
<style>
/* Slide 1. Coach Yinka (left, daylight) and Coach Gary (right, SC Fortuna
   Koln, night) as a two-panel cover, his own photos (Nov 4 2026), under
   the $100,000 question hook. Day and night panels are pulled together
   with one grade and one gradient. */
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:1080px;height:1350px;background:#0d0d0d;overflow:hidden}
body{font-family:'Barlow',sans-serif;color:#fff;position:relative}
.ph{position:absolute;top:0;width:540px;height:1350px;background-size:cover;background-position:center top;filter:saturate(.88) contrast(1.04)}
.l{left:0;background-image:url(photos/yinka.jpg)}
.r{left:540px;background-image:url(photos/gary.jpg)}
.div{position:absolute;left:539px;top:0;width:2px;height:1350px;background:linear-gradient(180deg,rgba(200,168,88,0) 0%,rgba(200,168,88,.9) 25%,rgba(200,168,88,.9) 50%,rgba(200,168,88,0) 72%)}
.sh{position:absolute;inset:0;background:linear-gradient(180deg,rgba(13,13,13,.55) 0%,rgba(13,13,13,.08) 18%,rgba(13,13,13,0) 36%,rgba(13,13,13,.72) 56%,rgba(13,13,13,.96) 70%,#0d0d0d 100%)}
.top{position:absolute;left:64px;top:60px;right:64px;display:flex;justify-content:space-between;align-items:center}
.eyebrow{font-family:'Barlow Condensed';font-weight:800;font-size:22px;letter-spacing:.24em;text-transform:uppercase;color:#c8a858}
.wm{font-family:'Barlow Condensed';font-weight:900;font-size:26px;letter-spacing:.12em;text-transform:uppercase}
.wm span{color:#c8a858}
.tag{position:absolute;top:120px;font-family:'Barlow Condensed';font-weight:800;font-size:21px;letter-spacing:.26em;text-transform:uppercase;color:#fff;padding:9px 16px;border:1px solid rgba(255,255,255,.35);background:rgba(13,13,13,.45);backdrop-filter:blur(6px)}
.tag.l{left:64px}.tag.r{left:604px}
.txt{position:absolute;left:64px;right:64px;bottom:140px}
.kick{font-family:'Barlow Condensed';font-weight:800;font-size:27px;letter-spacing:.22em;text-transform:uppercase;color:#c8a858;margin-bottom:20px}
h1{font-family:'Barlow Condensed';font-weight:900;font-size:84px;line-height:.92;text-transform:uppercase;letter-spacing:.005em;text-shadow:0 8px 50px rgba(0,0,0,.7)}
h1 span{color:#c8a858}
.ans{margin-top:30px;font-size:32px;line-height:1.3;font-weight:500;color:#fff}
.ans b{font-family:'Barlow Condensed';font-weight:900;font-size:58px;line-height:1;text-transform:uppercase;letter-spacing:.02em;display:block;margin-top:12px}
.ans b span{color:#c8a858}
.swipe{position:absolute;right:64px;bottom:60px;font-family:'Barlow Condensed';font-weight:800;font-size:24px;letter-spacing:.28em;text-transform:uppercase;color:#fff;display:flex;align-items:center;gap:14px}
.swipe i{display:block;width:44px;height:2px;background:#c8a858;position:relative}
.swipe i:after{content:"";position:absolute;right:0;top:-6px;width:12px;height:12px;border-top:2px solid #c8a858;border-right:2px solid #c8a858;transform:rotate(45deg)}
.handle{position:absolute;left:64px;bottom:60px;font-weight:700;font-size:22px;letter-spacing:.18em;text-transform:uppercase}
.handle:after{content:"";display:block;height:2px;width:100%;background:#c8a858;margin-top:6px}
</style>
<div class="ph l"></div><div class="ph r"></div><div class="div"></div><div class="sh"></div>
<div class="top"><div class="eyebrow">For ECNL and MLS NEXT players</div><div class="wm">Strive <span>Elite</span></div></div>
<div class="tag l">Coach Yinka</div><div class="tag r">Coach Gary</div>
<div class="txt">
  <div class="kick">We asked ourselves one question</div>
  <h1>If a parent paid us <span>$100,000</span> to get their player into a pro academy, what would we&nbsp;do?</h1>
  <p class="ans">Then we put all of it into one program.<b>Strive <span>Elite.</span></b></p>
</div>
<div class="handle">@strivesoccerfc</div>
<div class="swipe">Swipe to see inside <i></i></div>
