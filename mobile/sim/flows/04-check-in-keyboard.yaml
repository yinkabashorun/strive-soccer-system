# The weekly check-in with the keyboard up on a text box low on the page.
appId: com.strivesoccer.elite
---
- launchApp:
    clearState: true
    arguments:
      fixtureState: ok
      fixtureRoute: checkin
- extendedWaitUntil:
    visible: "Send"
    timeout: 30000
# the name above the box and the box are one thing: a tap on either types
- tapOn: "Anything else"
- inputText: "Legs felt heavy on Thursday."
- waitForAnimationToEnd:
    timeout: 3000
- takeScreenshot: t12-check-in-typing
- tapOn:
    point: "50%,8%"
- waitForAnimationToEnd:
    timeout: 3000
- takeScreenshot: t13-check-in-keyboard-away
