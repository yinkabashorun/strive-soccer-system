# The week's card (lib/elite/week-recap.ts weekCard): the free account on a
# Monday opens Week and finds last week's card at the top ("Best week yet:
# 3h 10m." with the small gold mark, gym on its own line, the one friend
# who did more, "Run it back."), taps "Got it", and the card is gone.
# Opened again, it stays gone: "Got it" is remembered for the week.
appId: com.strivesoccer.elite
---
- launchApp:
    clearState: true
    arguments:
      fixtureState: recap
- extendedWaitUntil:
    visible: "Week"
    timeout: 30000
- tapOn: "Week"
- extendedWaitUntil:
    visible: "Best week yet: 3h 10m.*"
    timeout: 15000
- waitForAnimationToEnd:
    timeout: 3000
- takeScreenshot: t90-week-recap
- tapOn: "Got it"
- assertNotVisible: "Best week yet: 3h 10m.*"
- takeScreenshot: t91-week-recap-gone
- stopApp
- launchApp:
    arguments:
      fixtureState: recap
- extendedWaitUntil:
    visible: "Week"
    timeout: 30000
- tapOn: "Week"
- extendedWaitUntil:
    visible: "Your week"
    timeout: 15000
- assertNotVisible: "Best week yet: 3h 10m.*"
