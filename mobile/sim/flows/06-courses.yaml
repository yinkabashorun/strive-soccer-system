# The Courses tab by taps: the tab bar, the shelf, a course of drills with
# a clip tapped (it plays, or pauses if it was the one already playing),
# and back to the shelf. A course of pages is opened by sim/shots.sh.
appId: com.strivesoccer.elite
---
- launchApp:
    clearState: true
    arguments:
      fixtureState: ok
- extendedWaitUntil:
    visible: "Start session"
    timeout: 30000
- tapOn: "Courses"
- extendedWaitUntil:
    visible: "All courses"
    timeout: 15000
- takeScreenshot: t17-courses-tab
- tapOn: "Keep It Up. The Juggling Ladder"
- extendedWaitUntil:
    visible: "Back to Courses"
    timeout: 15000
- waitForAnimationToEnd:
    timeout: 4000
- takeScreenshot: t18-course-drills
# A clip is nearly a screen tall, so it counts as in view at two thirds, and
# a slow machine gets the time to scroll to it (Nov 24 2026: the clip was on
# screen when the 20 seconds ran out).
- scrollUntilVisible:
    element: ".* One touch, keep it up"
    direction: DOWN
    visibilityPercentage: 66
    timeout: 45000
- takeScreenshot: t19-course-second-drill
- tapOn: ".* One touch, keep it up"
- waitForAnimationToEnd:
    timeout: 4000
- takeScreenshot: t20-course-clip-tapped
- tapOn: "Back to Courses"
- extendedWaitUntil:
    visible: "All courses"
    timeout: 15000
- takeScreenshot: t21-courses-back
