# Opens the native iPhone app (mobile/) in an iPhone simulator on GitHub's
# Mac and saves a picture of every screen, so the real iPhone screens can be
# looked at before a build is sent to TestFlight.
#
# Why it exists: the app is written on a machine with no phone. A browser at
# iPhone size has no keyboard, no notch and no iPhone tab bar, and the first
# TestFlight build shipped three faults nobody had seen (Nov 23 2026:
# docs/app-store/native-device-checklist.md).
#
# What it builds is NOT the app that ships. It is the example-data build
# (EXPO_PUBLIC_FIXTURES=1): one made-up member, no sign-in, nothing sent to
# the site. It is built for the simulator only, signed with nothing, and
# never uploaded anywhere: this workflow reads no Apple secret.
#
# Two passes over the same app:
#   1. mobile/sim/shots.sh    every screen opened by its own link, one
#                             picture each (plain simulator commands)
#   2. mobile/sim/flows/      taps and typing (the keyboard, a whole
#                             session), driven by Maestro; a flow that fails
#                             is reported and the rest still run
#
# The pictures are kept two ways: as the run's "iphone-screens" download,
# and on the branch "app-screens" (replaced on every run), where they can be
# read without signing in to GitHub.
#
# Runs when the app changes on a working branch, or by hand: GitHub >
# Actions > "iPhone simulator screens" > Run workflow.
name: iPhone simulator screens

on:
  workflow_dispatch:
  push:
    branches: ["claude/**"]
    paths:
      - "mobile/**"
      - ".github/workflows/ios-simulator-screens.yml"

concurrency:
  group: sim-screens-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  screens:
    runs-on: macos-26
    timeout-minutes: 80
    defaults:
      run:
        working-directory: mobile
    env:
      CI: "1"
      EXPO_NO_TELEMETRY: "1"
      EXPO_PUBLIC_FIXTURES: "1"
    steps:
      - uses: actions/checkout@v4

      # where the pictures are collected (the runner's temp folder is only
      # known once the job is running, so it is set here, not above)
      - name: Choose the pictures folder
        run: echo "SCREENS=$RUNNER_TEMP/screens" >> "$GITHUB_ENV"

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - name: Install the app's packages
        run: npm ci

      - name: Turn the example data on for this build
        run: printf 'EXPO_PUBLIC_FIXTURES=1\n' > .env.local

      - name: Generate the iPhone project
        run: npx expo prebuild --platform ios --clean

      - name: Build for the simulator
        run: |
          xcodebuild build \
            -workspace ios/StriveElite.xcworkspace \
            -scheme StriveElite \
            -configuration Release \
            -sdk iphonesimulator \
            -destination "generic/platform=iOS Simulator" \
            -derivedDataPath "$RUNNER_TEMP/dd" \
            ARCHS=arm64 ONLY_ACTIVE_ARCH=NO \
            -quiet
          APP="$RUNNER_TEMP/dd/Build/Products/Release-iphonesimulator/StriveElite.app"
          test -d "$APP"
          echo "APP=$APP" >> "$GITHUB_ENV"

      - name: Start an iPhone simulator
        run: |
          # the software keyboard only shows when no hardware one is attached
          defaults write com.apple.iphonesimulator ConnectHardwareKeyboard -bool false
          xcrun simctl list devices available -j > "$RUNNER_TEMP/devices.json"
          UDID=$(python3 - "$RUNNER_TEMP/devices.json" <<'PY'
          import json, re, sys
          devices = json.load(open(sys.argv[1]))["devices"]
          found = []
          for runtime, items in devices.items():
              m = re.search(r"iOS-(\d+)-(\d+)", runtime)
              if not m:
                  continue
              version = (int(m.group(1)), int(m.group(2)))
              for d in items:
                  name = d["name"]
                  n = re.fullmatch(r"iPhone (\d+)", name)  # a plain iPhone, no Pro, Plus, Air or e
                  if n:
                      found.append((version, int(n.group(1)), d["udid"], name))
          if not found:  # any iPhone at all
              for runtime, items in devices.items():
                  for d in items:
                      if d["name"].startswith("iPhone"):
                          found.append(((0, 0), 0, d["udid"], d["name"]))
          found.sort()
          print(found[-1][2])
          sys.stderr.write("Simulator: %s\n" % found[-1][3])
          PY
          )
          test -n "$UDID"
          echo "UDID=$UDID" >> "$GITHUB_ENV"
          xcrun simctl boot "$UDID"
          xcrun simctl bootstatus "$UDID" -b
          xcrun simctl status_bar "$UDID" override --time "9:41" --batteryState charged --batteryLevel 100 --cellularBars 4 --wifiBars 3 || true

      - name: Every screen, one picture each
        id: shots
        continue-on-error: true
        run: bash sim/shots.sh "$UDID" "$APP" "$SCREENS"

      - name: Taps and typing (Maestro)
        id: flows
        continue-on-error: true
        run: |
          curl -fsSL "https://get.maestro.mobile.dev" | bash
          export PATH="$HOME/.maestro/bin:$PATH"
          maestro --version
          xcrun simctl terminate "$UDID" com.strivesoccer.elite || true
          # screenshots land in the folder Maestro is run from
          cd "$SCREENS"
          maestro --device "$UDID" test "$GITHUB_WORKSPACE/mobile/sim/flows" 2>&1 | tee "$SCREENS/taps-log.txt"

      - name: Shrink the pictures and write what ran
        if: always()
        run: |
          mkdir -p "$SCREENS"
          cd "$SCREENS"
          for f in *.png; do
            [ -e "$f" ] || continue
            sips -s format jpeg -s formatOptions 72 -Z 1500 "$f" --out "${f%.png}.jpg" >/dev/null && rm "$f"
          done
          # Maestro's own failure pictures and logs, when a flow failed
          if [ -d "$HOME/.maestro/tests" ]; then
            mkdir -p maestro-debug
            find "$HOME/.maestro/tests" -type f \( -name "*.png" -o -name "*.log" \) -newer "$RUNNER_TEMP/devices.json" -exec cp {} maestro-debug/ \; || true
          fi
          {
            echo "# iPhone simulator screens"
            echo
            echo "Example data only: one made-up member, no real player, no account."
            echo
            echo "- commit: $GITHUB_SHA"
            echo "- branch: $GITHUB_REF_NAME"
            echo "- run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
            echo "- every screen (sim/shots.sh): ${{ steps.shots.outcome }}"
            echo "- taps and typing (sim/flows): ${{ steps.flows.outcome }}"
            echo
            echo "## Pictures"
            ls -1 *.jpg 2>/dev/null | sed 's/^/- /'
          } > README.md
          # a branch of pictures is not a site: Vercel leaves it alone
          printf '{ "git": { "deploymentEnabled": false } }\n' > vercel.json
          ls -la

      - name: Keep the pictures with the run
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: iphone-screens
          path: ${{ runner.temp }}/screens
          if-no-files-found: warn
          retention-days: 14

      - name: Put the pictures on the app-screens branch
        if: always()
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd "$SCREENS"
          git init -q -b app-screens
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "iPhone simulator screens for ${GITHUB_SHA}"
          git push -q -f "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" app-screens

      - name: Say so if a pass failed
        if: steps.shots.outcome == 'failure' || steps.flows.outcome == 'failure'
        run: |
          echo "Every screen: ${{ steps.shots.outcome }}. Taps and typing: ${{ steps.flows.outcome }}." >&2
          echo "The pictures that were taken are saved; read taps-log.txt on the app-screens branch." >&2
          exit 1
