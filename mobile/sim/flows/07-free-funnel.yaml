# The free funnel by taps, start to finish: Join free from the sign-in
# screen, the join screens, the quiz, the @username and photo, the offer,
# "Not now, start free", the week's target and days, Friends (locked), a
# post with a photo picked from the library, the feed unlocked, and Week.
#
# Example data only: nothing is sent anywhere, and the account made here
# lives in the app's memory until it is closed. The two photos are picked
# from the simulator's own sample library by where they sit on the screen
# (the phone's picker is not ours to label).
appId: com.strivesoccer.elite
---
- launchApp:
    clearState: true
    arguments:
      fixtureState: signedout
- extendedWaitUntil:
    visible: "Join free"
    timeout: 30000
- takeScreenshot: t22-sign-in-join-free
- tapOn: "Join free"

# Joining, one question a screen. The birthday first.
- extendedWaitUntil:
    visible: "March"
    timeout: 15000
- tapOn: "March"
- tapOn: "2010"
- takeScreenshot: t23-join-birthday
- tapOn: "Next"
- extendedWaitUntil:
    visible: "First name"
    timeout: 15000
- tapOn: "First name"
- inputText: "Marcus"
- tapOn: "Last name"
- inputText: "Bryant"
- takeScreenshot: t24-join-name-typing
- tapOn: "Next"
- extendedWaitUntil:
    visible: "Email"
    timeout: 15000
- tapOn: "Email"
- inputText: "marcus@example.com"
- tapOn: "Phone, so a coach can reach you"
- waitForAnimationToEnd:
    timeout: 2000
- takeScreenshot: t24b-join-phone-focused
- inputText: "7035550100"
# The number pad: on this simulator typed text has not always reached it
# (run of Nov 24 2026 left the box empty). When it has not, the pad's own
# keys are tapped, the way a player's thumb does it.
- runFlow:
    when:
      notVisible: "7035550100"
    commands:
      - tapOn: "7"
      - tapOn: "0"
      - tapOn: "3"
      - tapOn: "5"
      - tapOn: "5"
      - tapOn: "5"
      - tapOn: "0"
      - tapOn: "1"
      - tapOn: "0"
      - tapOn: "0"
- takeScreenshot: t24c-join-phone-typed
- tapOn: "Next"
- extendedWaitUntil:
    visible: "Password"
    timeout: 15000
- tapOn: "Password"
- inputText: "striveelite1"
- tapOn: "Next"
- extendedWaitUntil:
    visible: "Create my account"
    timeout: 15000
- tapOn: "I am 13 or older."
- tapOn: "I agree to the Terms of Service and the Privacy Policy."
- takeScreenshot: t25-join-agree
- tapOn: "Create my account"

# The quiz: the same screens a member takes, minus the three only a member
# is asked.
- extendedWaitUntil:
    visible: "Start"
    timeout: 20000
- takeScreenshot: t26-free-start
- tapOn: "Start"
- extendedWaitUntil:
    visible: "Boy"
    timeout: 15000
- tapOn: "Boy"
- extendedWaitUntil:
    visible: "High school"
    timeout: 10000
- takeScreenshot: t27-free-quiz-grade
- tapOn: "High school"
- extendedWaitUntil:
    visible: "Attacking midfield"
    timeout: 10000
- tapOn: "Attacking midfield"
- extendedWaitUntil:
    visible: "Right"
    timeout: 10000
- tapOn: "Right"
- extendedWaitUntil:
    visible: "Competitive"
    timeout: 10000
- tapOn: "Competitive"
# the team may be left empty: the button says Skip until something is typed
- extendedWaitUntil:
    visible: "Skip"
    timeout: 10000
- takeScreenshot: t27b-free-quiz-team-empty
- tapOn: "Club and age group"
- inputText: "Example FC 2010"
- tapOn: "Next"
# On the ball: every row is rated before Next works.
# A row is tapped only where a finger could reach it. The first three rows
# sit clear of the top bar and of Next as the page opens. For each row after
# that the page is dragged up by one row, slowly, so the next row comes to
# rest where the last one was. (scrollUntilVisible is not used here: it once
# stopped with the row half under Next, and with centerElement it carried a
# row up under the top bar, where the tap landed on Back.)
- extendedWaitUntil:
    visible: "First touch 2 of 5"
    timeout: 10000
- tapOn: "First touch 2 of 5"
- extendedWaitUntil:
    visible: "Close control 3 of 5"
    timeout: 10000
- tapOn: "Close control 3 of 5"
- extendedWaitUntil:
    visible: "Weak foot 1 of 5"
    timeout: 10000
- tapOn: "Weak foot 1 of 5"
- swipe:
    start: "50%,62%"
    end: "50%,45%"
    duration: 1500
- extendedWaitUntil:
    visible: "Dribbling and 1v1 3 of 5"
    timeout: 10000
- tapOn: "Dribbling and 1v1 3 of 5"
- swipe:
    start: "50%,62%"
    end: "50%,45%"
    duration: 1500
- extendedWaitUntil:
    visible: "Short passing 4 of 5"
    timeout: 10000
- tapOn: "Short passing 4 of 5"
- swipe:
    start: "50%,62%"
    end: "50%,45%"
    duration: 1500
- extendedWaitUntil:
    visible: "Long passing 3 of 5"
    timeout: 10000
- tapOn: "Long passing 3 of 5"
- swipe:
    start: "50%,62%"
    end: "50%,45%"
    duration: 1500
- extendedWaitUntil:
    visible: "Shooting 3 of 5"
    timeout: 10000
- tapOn: "Shooting 3 of 5"
- takeScreenshot: t28-free-quiz-on-ball
- tapOn: "Next"
# Off the ball: the same way.
- extendedWaitUntil:
    visible: "Speed 3 of 5"
    timeout: 10000
- tapOn: "Speed 3 of 5"
- extendedWaitUntil:
    visible: "Agility 3 of 5"
    timeout: 10000
- tapOn: "Agility 3 of 5"
- extendedWaitUntil:
    visible: "Strength 3 of 5"
    timeout: 10000
- tapOn: "Strength 3 of 5"
- swipe:
    start: "50%,62%"
    end: "50%,45%"
    duration: 1500
- extendedWaitUntil:
    visible: "Fitness 4 of 5"
    timeout: 10000
- tapOn: "Fitness 4 of 5"
- swipe:
    start: "50%,62%"
    end: "50%,45%"
    duration: 1500
- extendedWaitUntil:
    visible: "Scanning 3 of 5"
    timeout: 10000
- tapOn: "Scanning 3 of 5"
- swipe:
    start: "50%,62%"
    end: "50%,45%"
    duration: 1500
- extendedWaitUntil:
    visible: "Decision making 3 of 5"
    timeout: 10000
- tapOn: "Decision making 3 of 5"
- swipe:
    start: "50%,62%"
    end: "50%,45%"
    duration: 1500
- extendedWaitUntil:
    visible: "Movement 3 of 5"
    timeout: 10000
- tapOn: "Movement 3 of 5"
- swipe:
    start: "50%,62%"
    end: "50%,45%"
    duration: 1500
- extendedWaitUntil:
    visible: "Defending 3 of 5"
    timeout: 10000
- tapOn: "Defending 3 of 5"
- takeScreenshot: t28b-free-quiz-off-ball
- tapOn: "Next"
- extendedWaitUntil:
    visible: "Make a higher team"
    timeout: 10000
- takeScreenshot: t29-free-quiz-aim
- tapOn: "Make a higher team"
- extendedWaitUntil:
    visible: "Three or four times"
    timeout: 10000
- tapOn: "Three or four times"
- extendedWaitUntil:
    visible: "Room to run"
    timeout: 10000
- tapOn: "Room to run"
- extendedWaitUntil:
    visible: "A wall"
    timeout: 10000
- tapOn: "A wall"
- takeScreenshot: t30-free-quiz-last
- tapOn: "Finish"

# The @username and the photo, before the offer that shows their card.
- extendedWaitUntil:
    visible: "Username"
    timeout: 20000
- tapOn: "Username"
- inputText: "marcus.b"
- waitForAnimationToEnd:
    timeout: 3000
- tapOn: "Next"
- extendedWaitUntil:
    visible: "Choose from photos"
    timeout: 15000
- tapOn: "Choose from photos"
- extendedWaitUntil:
    visible: "Cancel"
    timeout: 15000
- waitForAnimationToEnd:
    timeout: 5000
# the first photo in the phone's own picker, then its Choose (the crop)
- tapOn:
    point: "17%,32%"
- waitForAnimationToEnd:
    timeout: 5000
- tapOn:
    text: "Choose"
    optional: true
- waitForAnimationToEnd:
    timeout: 5000
- takeScreenshot: t31-free-photo-picked
- tapOn: "Next"

# The offer, once, with their own card.
- startRecording: offer-after-quiz
- extendedWaitUntil:
    visible: "Not now, start free"
    timeout: 20000
- waitForAnimationToEnd:
    timeout: 5000
- takeScreenshot: t32-offer
- stopRecording
- tapOn: "Not now, start free"

# The week: the target we recommend and the days they train.
- extendedWaitUntil:
    visible: "Start my week"
    timeout: 15000
- tapOn: "Monday"
- tapOn: "Tuesday"
- tapOn: "Thursday"
- tapOn: "Saturday"
- takeScreenshot: t33-week-plan
- tapOn: "Start my week"

# Friends: today's posts are locked until training is posted today.
- extendedWaitUntil:
    visible: "Start training"
    timeout: 20000
- waitForAnimationToEnd:
    timeout: 4000
- takeScreenshot: t34-friends-locked

# THE TRAINING CLOCK: a photo starts it, a photo stops it, and the time
# between the two is the training. On a phone both photos come from the
# camera only; the simulator has no camera, so in this example build (and
# only in it) the phone's photos stand in. The example clock opens 45
# minutes in, so the pictures show a real session.
- tapOn: "Start training"
- extendedWaitUntil:
    visible: "Take my start photo"
    timeout: 15000
- takeScreenshot: t35-clock-start
- tapOn: "Take my start photo"
- extendedWaitUntil:
    visible: "Cancel"
    timeout: 15000
- waitForAnimationToEnd:
    timeout: 5000
- tapOn:
    point: "17%,32%"
- extendedWaitUntil:
    visible: "Take my finish photo"
    timeout: 20000
- waitForAnimationToEnd:
    timeout: 3000
- takeScreenshot: t35b-clock-running

# The clock is never out of sight: close the screen and it sits at the top
# of Friends and of Week, one tap from the finish photo.
- tapOn: "Close"
- extendedWaitUntil:
    visible: "Finish my training"
    timeout: 15000
- takeScreenshot: t35c-clock-row-friends
- tapOn: "Week"
# the link reads "Change" and is named "Change your target and days" to a
# screen reader, which is what this tool matches (the run on 52803b1 waited
# for "Change" alone and stopped here with the Week tab right on screen)
- extendedWaitUntil:
    visible: "Change your target and days"
    timeout: 15000
- waitForAnimationToEnd:
    timeout: 3000
- takeScreenshot: t35d-clock-row-week
# the row is one thing to a screen reader: "Training. 45:20. Take my finish photo"
# ONE TAP TO THE CAMERA: the row opens the clock and the camera comes up by
# itself (here, the phone's photos)
- tapOn: "Training\\..*Take my finish photo"
- extendedWaitUntil:
    visible: "Cancel"
    timeout: 20000
- waitForAnimationToEnd:
    timeout: 5000
- tapOn:
    point: "50%,32%"
- extendedWaitUntil:
    visible: "Post to my friends"
    timeout: 20000
- waitForAnimationToEnd:
    timeout: 3000
# nobody picks a length: it is the time between the two photos
- assertVisible: "Ready to post\\. 45m\\..*"
# Forgot to stop the clock: time comes off, five minutes a tap, and back
- tapOn: "Finished before you took this photo\\?"
- tapOn: "5 min less"
- tapOn: "5 min less"
- assertVisible: "Ready to post\\. 35m\\..*"
- takeScreenshot: t36a-clock-time-off
- tapOn: "5 min more"
- tapOn: "5 min more"
- assertVisible: "Ready to post\\. 45m\\..*"
- takeScreenshot: t36-clock-ready
- tapOn: "One line about your training"
- inputText: "Weak foot only."
# the post button rides on the keyboard
- takeScreenshot: t36b-post-typing
- tapOn: "Post to my friends"
# asked once, after the first post, with the reason
- extendedWaitUntil:
    visible: "Not now"
    timeout: 20000
- takeScreenshot: t37-post-notifications-ask
- tapOn: "Not now"
# the clock was opened from Week, so that is where posting returns to
- tapOn: "Friends"

# The feed is open now, with their own post first. Its one line sits under
# the photo, so it is scrolled to (the run on 3108e77 looked for it without
# scrolling and stopped here, with the post right there on screen).
- extendedWaitUntil:
    visible: "Just now"
    timeout: 20000
- waitForAnimationToEnd:
    timeout: 4000
- takeScreenshot: t38-friends-unlocked
- scrollUntilVisible:
    element: "Weak foot only."
    direction: DOWN
    timeout: 15000
- takeScreenshot: t38b-own-post-line
- tapOn: "Week"
- extendedWaitUntil:
    visible: "Change your target and days"
    timeout: 15000
- waitForAnimationToEnd:
    timeout: 4000
- takeScreenshot: t39-free-week
